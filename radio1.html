
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&display=swap">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
    <title>Radio Stephanie en vivo</title>
    <style>
    html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
    }
    body {
        background: url(https://xatimg.com/image/TTosVhjmOcFt.gif);
        background-size: cover;
        overflow: hidden;
    }
    .btn {
        box-shadow: 0 0 10px 1px rgba(0, 0, 0, 0.6) !important; /* tricky */
        border-color: transparent !important; /* tricky */
        color: #fff;
    }
    .btn-success {
        background-color: #0652DD;
    }
    .btn-warning {
        background-color: #44bd32;
    }
    .btn-danger {
        background-color: #D980FA;
    }
    .btn-success:hover,
    .btn-success:active,
    .btn-success:focus {
        background-color: #0097e6;
        color: #fff;
    }
    .btn-warning:hover,
    .btn-warning:active,
    .btn-warning:focus {
        background-color: #009432;
        color: #fff;
    }
    .btn-danger:hover,
    .btn-danger:active,
    .btn-danger:focus {
        background-color: #B53471;
        color: #fff;
    }
    .vol-size {
        font-size: 1.3rem;
    }
    .radio-name {
        font-size: 2rem;
        margin-top: 5vh;
        color: #1289A7;
     }
    .status {
        color: #fff;
    }
    .radio-buttons {
        padding-top: 10px;
        padding-bottom: 10px;
        margin-right: 10vw;
        margin-left: 10vw;
        margin-top: 10vh;
        background-color: rgba(0, 162, 255, 0.5);
        box-shadow: 0 0 10px 1px rgba(1, 2, 71, 0.6) !important;
        border-radius: 10px;
    }
    .radio-volume {
        color: #0652DD;
        margin-left: 10vw;
        margin-right: 10vw;
        display: inline-block;
        margin-top: 10vh;
        text-shadow: 
            0 0 5px #FFF, 
            0 0 10px #FFF, 
            0 0 15px #FFF, 
            0 0 20px #49ff18, 
            0 0 30px #49FF18, 
            0 0 40px #49FF18, 
            0 0 55px #49FF18, 
            0 0 75px #49ff18, 
            2px 2px 2px rgba(175,44,206,0);
    }
    .radio-volume i {
        margin-right: 10px;
        font-size: 1.2rem;
    }
    </style>
</head>
<body>
    <div class="container-fluid p-3">
        <div class="text-center">
            <h2 class="radio-name">Stephanie</h2>
            <p class="status mt-5">
                [<span class="icon">
                    <i class="fas fa-info-circle"></i>
                </span>] 
                <span class="text">Loading...</span>
            </p>
            <audio id="player" preload="none"></audio>
            <div class="radio-buttons">
                <button type="button" id="play" class="btn btn-success btn-round shadow">
                    <i class="far fa-play-circle"></i> Play
                </button>
                <button type="button" id="pause" class="btn btn-danger shadow">
                    <i class="far fa-pause-circle"></i> Pause
                </button>
                <button type="button" id="stop" class="btn btn-warning shadow">
                    <i class="far fa-stop-circle"></i> Stop
                </button>
            </div>
            <div class="radio-volume">
                <div class="form-group">
                    <label for="vol">
                        <i class="fas fa-volume-up"></i>
                    </label>
                    <input type="range" class="form-control-range" id="vol" value="75" min="0" max="100">
                    <span class="vol-size">75%</span>
                  </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
    <script>
        // Fuente principal y enlaces alternativos de RecStreamLive.
        const streamUrls = [
            "https://recstreamlive.com/8026/stream",
            "https://recstreamlive.com:8026/stream",
            "https://recstreamlive.com/0/stream"
        ];

        const radio = document.getElementById('player');
        const statusText = document.querySelector('.status .text');
        const statusIcon = document.querySelector('.status .icon');
        const radioName = document.querySelector('.radio-name');
        const vol = document.getElementById('vol');
        const volSize = document.querySelector('.vol-size');
        let streamIndex = 0;
        let wantsPlayback = false;
        let playerState = 'stopped';

        function showStatus(message, playing = false) {
            statusText.textContent = message;
            statusIcon.innerHTML = playing
                ? '<i class="fas fa-volume-up"></i>'
                : '<i class="fas fa-info-circle"></i>';
        }

        function loadStream(index) {
            if (index >= streamUrls.length) {
                wantsPlayback = false;
                playerState = 'error';
                showStatus('No se pudo conectar con la radio. Intenta de nuevo.');
                return;
            }
            streamIndex = index;
            radio.src = streamUrls[streamIndex];
            radio.load();
            showStatus('Conectando con la radio...');
            if (wantsPlayback) attemptPlayback();
        }

        function nextStream() {
            if (!wantsPlayback) return;
            loadStream(streamIndex + 1);
        }

        function attemptPlayback() {
            if (!radio.getAttribute('src')) {
                loadStream(0);
                return;
            }
            const sourceAtAttempt = radio.getAttribute('src');
            const action = radio.play();
            if (action && typeof action.catch === 'function') {
                action.catch(error => {
                    if (sourceAtAttempt !== radio.getAttribute('src')) return;
                    // Los navegadores pueden impedir la reproducción automática.
                    if (error.name === 'NotAllowedError') {
                        wantsPlayback = false;
                        showStatus('Presiona Play para escuchar la radio.');
                    } else if (error.name !== 'AbortError') {
                        nextStream();
                    }
                });
            }
        }

        radio.addEventListener('playing', () => {
            playerState = 'playing';
            showStatus('Reproduciendo en vivo...', true);
        });
        radio.addEventListener('waiting', () => {
            if (wantsPlayback) showStatus('Cargando la señal...');
        });
        radio.addEventListener('error', () => {
            if (wantsPlayback) nextStream();
        });

        document.getElementById('play').addEventListener('click', () => {
            if (playerState === 'error') {
                streamIndex = 0;
                radio.removeAttribute('src');
            }
            wantsPlayback = true;
            attemptPlayback();
        });

        document.getElementById('pause').addEventListener('click', () => {
            wantsPlayback = false;
            radio.pause();
            playerState = 'paused';
            showStatus('En pausa');
        });

        document.getElementById('stop').addEventListener('click', () => {
            wantsPlayback = false;
            radio.pause();
            radio.removeAttribute('src');
            radio.load();
            streamIndex = 0;
            playerState = 'stopped';
            showStatus('Detenido');
        });

        radio.volume = 0.75;
        vol.addEventListener('input', () => {
            const value = Math.min(100, Math.max(0, Number(vol.value)));
            radio.volume = value / 100;
            volSize.textContent = value + '%';
        });

        // Mantener los efectos visuales originales sin afectar la radio si faltan librerías.
        if (window.jQuery && typeof jQuery.fn.ripples === 'function') {
            try {
                jQuery('html').ripples({
                    resolution: 256,
                    interactive: true,
                    perturbance: 0.1
                });
            } catch (error) {
                // El reproductor sigue funcionando aunque el efecto no esté disponible.
            }
        }
        if (radioName) {
            radioName.style.textShadow = Array.from({length: 15}, (_, i) =>
                `rgba(0, 0, 0, 0.02) ${i + 1}px ${i + 1}px`
            ).join(', ');
        }
        showStatus('Presiona Play para escuchar la radio.');
        loadStream(0);
        wantsPlayback = true;
        attemptPlayback();
    </script>
</body>
</html>
